stages:
  - build
  - deploy

variables:
  # 镜像前缀，推荐配置在GitLab后台CI环境变量，避免代码硬编码泄露
  IMAGE_NAME: "harbor.mycorp.com/fullstack/my-app"
  # Compose部署超时等待，保障服务健康就绪
  COMPOSE_WAIT_TIMEOUT: "60"
  # 必须由 GitLab 后台 CI/CD Variables 配置的变量（缺失时 fail-fast）
  # 涵盖 CI/CD 基建 + docker-compose 运行期（compose 实际引用）全量变量
  REQUIRED_CI_VARS: "REGISTRY_USER REGISTRY_PASSWORD DEPLOY_SERVER_HOST DEPLOY_PATH DEPLOY_SSH_PRIVATE_KEY \
    SERVER_PORT VITE_PORT DB_USER DB_PASSWORD DB_NAME DB_HOST \
    DB_POOL_MAX DB_IDLE_TIMEOUT_MS DB_CONNECTION_TIMEOUT_MS \
    REDIS_PASSWORD NODE_ENV COMPOSE_WAIT_TIMEOUT"

# ====================== 构建阶段（可复用模板） ======================
# 构建阶段共用的Runner要求：标签 docker
.build_base: &build_base
  image: docker:latest
  services:
    - docker:dind
  tags:
    - docker

# 环境变量存在性校验模板：缺任何必填变量时立即失败并输出缺哪个
.check_env: &check_env
  before_script:
    - |
      for v in $REQUIRED_CI_VARS; do
        if [ -z "${!v}" ]; then
          echo "❌ 缺少 GitLab CI 环境变量: $v"
          echo "请在 Settings → CI/CD → Variables 中配置后再重跑。"
          exit 1
        fi
      done

# 镜像构建 & 推送阶段
build_image:
  <<: *build_base
  <<: *check_env
  stage: build
  script:
    # 先登录Harbor镜像仓库
    - echo "$REGISTRY_PASSWORD" | docker login ${IMAGE_NAME%%/*} -u "$REGISTRY_USER" --password-stdin
    # 镜像Tag使用完整Git Commit SHA，版本唯一可追溯
    - docker build -t ${IMAGE_NAME}:${CI_COMMIT_SHA} .
    - docker push ${IMAGE_NAME}:${CI_COMMIT_SHA}

# 生产部署阶段
deploy_prod:
  stage: deploy
  # before_script 复用 .check_env：与 build 共用同一份必填校验，不再各自重复编写
  <<: *check_env
  script:
    # ---- SSH 准备（仅 deploy 需要；before/script 同 shell，此处 eval 的 agent 后续 ssh 可用）----
    - set +e
    - command -v ssh-agent >/dev/null
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - >/dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan "$DEPLOY_SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
    # 生产机不落 .env 文件：compose 所需的插值变量由 CI 后台注入，经远程 shell export 提供
    # 注意：只 export compose 真正 ${...} 插值的变量；VITE_PORT / DB_HOST / DB_PORT / 连接池 / REDIS_HOST/REDIS_PORT 等
    #       未被 docker-compose.yml 引用，无需导出（导出也不会有任何效果）
    - >
      ssh -o StrictHostKeyChecking=no root@${DEPLOY_SERVER_HOST} "
        cd ${DEPLOY_PATH} &&
        export IMAGE_NAME=${IMAGE_NAME} CI_COMMIT_SHA=${CI_COMMIT_SHA}
               SERVER_PORT=${SERVER_PORT} NODE_ENV=${NODE_ENV}
               DB_USER=${DB_USER} DB_PASSWORD=${DB_PASSWORD} DB_NAME=${DB_NAME}
               REDIS_PASSWORD=${REDIS_PASSWORD} 
               DB_POOL_MAX=${DB_POOL_MAX} DB_IDLE_TIMEOUT_MS=${DB_IDLE_TIMEOUT_MS} DB_CONNECTION_TIMEOUT_MS=${DB_CONNECTION_TIMEOUT_MS} &&
        docker compose pull &&
        docker compose up -d --wait --wait-timeout ${COMPOSE_WAIT_TIMEOUT}
      "
  # 仅 master 主干分支触发生产部署
  only:
    - master